<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Çiftlik Çarşısı</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet"><style>
:root{--bg:#e4f2dc;--panel:#fff;--ink:#1d2b1f;--mut:#5b6f5e;--leaf:#2f7d3a;--line:#c9dcc0;--bad:#b3402a;--soil:#8a5a33;--soil2:#a0703f}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a12;--panel:#1a2a1f;--ink:#e6f1e3;--mut:#9bb09e;--leaf:#5cbf6a;--line:#2c4232;--bad:#e8806a;--soil:#6b4425;--soil2:#82552d}}
*{box-sizing:border-box}body{margin:0 auto;max-width:680px;padding:12px 12px 88px;background:var(--bg);color:var(--ink);font-family:Fredoka,ui-rounded,system-ui,sans-serif}
h1{font-size:22px;margin:4px 0 10px}h2{font-size:16px;margin:0 0 8px}[hidden]{display:none!important}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;font-weight:600}
.btn,.t{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:8px 10px;font:inherit;font-size:14px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}
.t[aria-pressed=true]{border-color:var(--leaf);background:var(--leaf);color:#fff}
:focus-visible{outline:3px solid #2a7fc1;outline-offset:2px}
input{font:inherit;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row:last-child{border:0}
.f{display:flex;gap:6px;flex-wrap:wrap}.f input{width:84px;margin:0}.mut{color:var(--mut);font-size:13px}
.msg{position:sticky;top:6px;z-index:7;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--leaf);font-weight:600;font-size:14px}.msg:empty{display:none}.msg.err,#aerr{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--soil);padding:8px;border-radius:16px;margin:10px 0}
.p{aspect-ratio:1;background:var(--soil2);border:0;border-radius:10px;font-size:clamp(24px,8vw,40px);position:relative;cursor:pointer;color:inherit}.p:disabled{opacity:.5}
.p .b{position:absolute;left:6px;right:6px;bottom:5px;height:5px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden}.p .b i{display:block;height:100%;background:#8fe08c}
.p .d{position:absolute;top:2px;right:4px;font-size:15px}.p.ready{box-shadow:inset 0 0 0 3px #ffd84a}
.seeds{display:flex;gap:6px;flex-wrap:wrap}.big{width:100%;margin-top:8px;font-weight:600;padding:12px}
.stall{margin:6px 0 12px}.awn{height:34px;border-radius:12px 12px 0 0;background:repeating-linear-gradient(90deg,var(--c) 0 28px,#fff 28px 56px)}
.sign{background:var(--soil);color:#fff;text-align:center;padding:6px;font-weight:600;font-size:15px}
.shelf{background:var(--soil2);padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px;border-left:6px solid var(--soil);border-right:6px solid var(--soil)}
.it{background:rgba(255,255,255,.18);border:2px solid transparent;border-radius:10px;padding:4px 8px;font-size:26px;line-height:1.2;text-align:left;cursor:pointer;color:#fff;word-break:break-all}.it.on{border-color:#ffd84a;background:rgba(255,255,255,.32)}
.ctr{height:26px;background:var(--soil);border-radius:0 0 10px 10px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:680px;z-index:8;display:flex;background:var(--panel);border-top:2px solid var(--line);padding:6px;gap:2px}
.tabs .t{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;border-width:0}.tabs .t span{font-size:22px}
input[type=checkbox]{width:auto;margin:0 8px 0 0}.chk{display:block;margin:4px 0 10px}a{color:var(--leaf)}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<h1>🏪 Çiftlik Çarşısı</h1>
<form id="auth" class="card" autocomplete="on">
  <h2 id="at">Giriş yap</h2>
  <input id="em" name="username" placeholder="Kullanıcı adı" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="40" required>
  <input id="pw" name="password" type="password" placeholder="Şifre (en az 6 karakter)" autocomplete="current-password" required>
  <label class="chk"><input type="checkbox" id="rm" checked>Beni hatırla</label>
  <button class="btn big" id="go" type="submit">Giriş yap</button>
  <p class="mut"><a href="#" id="sw">Hesabın yok mu? Kayıt ol</a> <a href="#" id="rst" hidden>· Şifremi sıfırla</a></p>
  <p id="aerr" role="alert"></p>
</form>
<div id="app" hidden><div class="card bar" id="bar"></div><p class="msg" id="msg" role="status"></p><main id="v"></main>
<nav class="tabs" id="tabs" hidden><button class="t" data-a="tab" data-v="work"><span>🧑‍🌾</span>İş</button><button class="t" data-a="tab" data-v="stall"><span>🏪</span>Tezgah</button><button class="t" data-a="tab" data-v="pazar"><span>🛍️</span>Pazar</button><button class="t" data-a="tab" data-v="market"><span>🛒</span>Market</button></nav></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail,setPersistence,browserLocalPersistence,browserSessionPersistence} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,query,limit,getDocs,addDoc,where,deleteDoc,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyB91qaXPfss8qloRDsUV8snNIaA8CXf_b4",
  authDomain: "bahcivanlar-17544.firebaseapp.com",
  projectId: "bahcivanlar-17544",
  appId: "1:376440194167:web:e439d7a5975f3a2215f272"
};


const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let S,uid,pend,dirty=false,tab='work',sel=null,sd='tohum_havuc';
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>Number(n).toLocaleString('tr-TR');
const nk=n=>'n_'+encodeURIComponent(n.trim().toLowerCase()).replace(/\./g,'%2E');
const I={tohum_havuc:['🌱','Havuç tohumu'],tohum_bugday:['🌰','Buğday tohumu'],havuc:['🥕','Havuç'],bugday:['🌾','Buğday'],yumurta:['🥚','Yumurta'],sut:['🥛','Süt'],yem:['🌽','Yem'],gubre:['🧪','Gübre'],ham:['🧱','Hammadde'],demir:['⛓️','Demir'],mk_tarim:['🚜','Ekim-hasat makinesi'],mk_hayvan:['🤖','Yemleme-toplama makinesi']};
const CR={tohum_havuc:{o:'havuc',t:60},tohum_bugday:{o:'bugday',t:120}};
const AN={tavuk:{e:'🐔',n:'Tavuk',o:'yumurta',t:120},inek:{e:'🐄',n:'İnek',o:'sut',t:240}};
const PF={tarim:['🌾','Tarım','#3f8f3a','Tohum eker, ürün biçer. Gübreyle hızlandırır.'],hayvan:['🐄','Hayvancı','#b5651d','Hayvan besler, yumurta ve süt toplar.'],otomat:['🤖','Otomat makinacı','#2f6fa8','Gübre, yem ve makine üretip satar.']};
const START={tarim:{coins:100,inv:{tohum_havuc:5}},hayvan:{coins:150,inv:{yem:3},an:'tavuk'},otomat:{coins:150,inv:{ham:6,demir:2}}};
const CRAFT=[['gubre',1,{ham:2}],['yem',2,{ham:1}],['mk_tarim',1,{ham:4,demir:2}],['mk_hayvan',1,{ham:4,demir:2}]];
const M=[['tohum_havuc',5,60],['tohum_bugday',5,90],['yem',3,150],['gubre',2,200],['ham',5,250],['demir',2,180],['tavuk',1,600],['inek',1,2200]];
const LIM=12,TAX=.2,HOUR=36e5;
const nm=k=>I[k]?I[k][1]:AN[k].n,em=k=>I[k]?I[k][0]:AN[k].e;
const save=()=>{dirty=true};
const say=(t,e)=>{const m=$('msg');m.textContent=t;m.className='msg'+(e?' err':'');clearTimeout(say.t);say.t=setTimeout(()=>{m.textContent=''},6000)};
const add=(k,n)=>{S.inv[k]=(S.inv[k]||0)+n;if(S.inv[k]<=0)delete S.inv[k]};
const have=k=>S.inv[k]||0,left=k=>(S.mu[k]||0)+have(k)*LIM;
function useMk(k){if(S.mu[k]>0){S.mu[k]--;return true}if(have(k)>0){add(k,-1);S.mu[k]=LIM-1;return true}say('Makinen yok ya da kullanım hakkı bitti.',1);return false}
const sdone=p=>p&&Date.now()-p.at>=CR[p.s].t*1000;
function harvest(i){const p=S.plots[i];add(CR[p.s].o,2);S.plots[i]=null}
function feedCollect(a){const t=AN[a.k];let n=0;if(a.f>0&&Date.now()-a.at>=t.t*1000){add(t.o,1);a.f--;a.at=Date.now();n++}if(a.f<=0&&have('yem')){add('yem',-1);a.f=3;a.at=Date.now();n++}return n}
/* ---- çizim ---- */
const mkInfo=k=>'<p class="mut">'+I[k][0]+' Makine: kalan '+left(k)+' kullanım. Makine yoksa işleri tek tek yaparsın.</p>';
function work(){
 if(S.pf==='tarim')return '<div class="seeds">'+['tohum_havuc','tohum_bugday'].map(k=>'<button class="t" data-a="sd" data-k="'+k+'" aria-pressed="'+(sd===k)+'">'+I[k][0]+' '+I[k][1]+' ('+have(k)+')</button>').join('')+'</div><div class="grid">'+S.plots.map((p,i)=>{if(!p)return '<button class="p" data-a="pl" data-i="'+i+'" aria-label="Boş tarla">🟫</button>';const c=CR[p.s],pr=Math.min(1,(Date.now()-p.at)/(c.t*1000));return pr>=1?'<button class="p ready" data-a="pl" data-i="'+i+'">'+em(c.o)+'</button>':'<button class="p" data-a="pl" data-i="'+i+'">🌱<span class="b"><i style="width:'+Math.round(pr*100)+'%"></i></span>'+(p.g?'<span class="d">🧪</span>':'')+'</button>'}).join('')+'</div><p class="mut">Boş tarlaya dokun: ek. Büyüyene dokun: gübre ('+have('gubre')+'). Hazır olana dokun: biç.</p><button class="btn big" data-a="mt">🚜 Hepsini ek / hasat et</button>'+mkInfo('mk_tarim');
 if(S.pf==='hayvan')return '<div class="grid">'+S.an.map((a,i)=>{if(!a)return '<button class="p" data-a="none" disabled>➕</button>';const t=AN[a.k],rd=a.f>0&&Date.now()-a.at>=t.t*1000;return '<button class="p'+(rd?' ready':'')+'" data-a="an" data-i="'+i+'">'+t.e+(a.f>0?(rd?'<span class="d">'+em(t.o)+'</span>':'<span class="b"><i style="width:'+Math.round(Math.min(1,(Date.now()-a.at)/(t.t*1000))*100)+'%"></i></span>'):'<span class="d">🍽️</span>')+'</button>'}).join('')+'</div><p class="mut">🍽️ aç: dokununca yem verirsin ('+have('yem')+' yem var). Hazır olana dokununca toplarsın. Yeni hayvanı Marketten al.</p><button class="btn big" data-a="ma">🤖 Hepsini besle / topla</button>'+mkInfo('mk_hayvan');
 return '<div class="card"><h2>🏭 Üretim</h2>'+CRAFT.map((c,i)=>'<div class="row"><span>'+em(c[0])+' <b>'+nm(c[0])+'</b> ×'+c[1]+' <span class="mut">← '+Object.keys(c[2]).map(k=>c[2][k]+em(k)+' (sende '+have(k)+')').join(' ')+'</span></span><button class="btn" data-a="cr" data-i="'+i+'"'+(Object.keys(c[2]).some(k=>have(k)<c[2][k])?' disabled':'')+'>Üret</button></div>').join('')+'</div><p class="mut">Ürettiklerini Tezgah sekmesinden Pazara koyabilirsin. Gübre ve yem tarımcı ile hayvancıya, makineler ikisine de satılır.</p>'}
function stall(){const ks=Object.keys(S.inv),p=PF[S.pf];
 const shelf=ks.map(k=>'<button class="it'+(sel===k?' on':'')+'" data-a="sel" data-k="'+k+'" aria-label="'+nm(k)+'">'+em(k).repeat(Math.min(S.inv[k],14))+(S.inv[k]>14?'<small>+</small>':'')+'</button>').join('')||'<p class="mut">Tezgahın boş. Üretince ürünler burada dizilir.</p>';
 const f=sel&&have(sel)?'<div class="card"><h2>'+em(sel)+' '+nm(sel)+' ('+have(sel)+' adet)</h2><div class="f"><input id="lq" type="number" min="1" max="'+have(sel)+'" value="'+have(sel)+'" aria-label="Adet"><input id="lp" type="number" min="1" max="9999" value="10" aria-label="Birim fiyat"><button class="btn" data-a="list">Pazara koy</button></div><p class="mut">Satıştan %20 vergi kesilir.</p></div>':'<p class="mut">Satmak için tezgahtaki ürüne dokun.</p>';
 return '<div class="stall" style="--c:'+p[2]+'"><div class="awn"></div><div class="sign">'+p[0]+' '+p[1]+' Tezgâhı · '+esc(S.name)+'</div><div class="shelf">'+shelf+'</div><div class="ctr"></div></div>'+f}
const left1=k=>{const r=(S.mk[k]||0)+HOUR-Date.now();return r>0?Math.ceil(r/6e4):0};
function market(){return '<div class="card"><h2>🏪 Market</h2><p class="mut">Herkese açık ama pahalı. Her ürün saatte bir kez alınabilir.</p>'+M.map((m,i)=>{const w=left1(m[0]);return '<div class="row"><span>'+em(m[0]).repeat(m[1])+' <b>'+nm(m[0])+'</b></span><button class="btn" data-a="bm" data-i="'+i+'"'+(w||S.coins<m[2]?' disabled':'')+'>'+(w?'⏳ '+w+' dk':m[2]+' 🪙')+'</button></div>'}).join('')+'</div>'}
function pazar(){return '<div class="card"><h2>🛍️ Pazar</h2><p class="mut">Serbest piyasa. Satıcı her satıştan %20 vergi öder.</p><div id="pl">Yükleniyor…</div></div>'}
async function loadPz(){const qs=await getDocs(query(collection(db,'listings'),where('sold','==',false),limit(40)));
 const ls=qs.docs.map(d=>({id:d.id,...d.data()})).filter(d=>I[d.crop]).sort((a,b)=>b.createdAt-a.createdAt);
 if(tab==='pazar'&&$('pl'))$('pl').innerHTML=ls.map(d=>'<div class="row"><span>'+em(d.crop)+' '+nm(d.crop)+' ×'+d.qty+' <span class="mut">'+d.price+' 🪙/adet · '+esc(d.name)+'</span></span>'+(d.seller===uid?'<button class="btn" data-a="cx" data-id="'+d.id+'">İptal</button>':'<button class="btn" data-a="bl" data-id="'+d.id+'"'+(S.coins<d.price*d.qty?' disabled':'')+'>Al '+d.price*d.qty+' 🪙</button>')+'</div>').join('')||'<p class="mut">İlan yok. İlk ilanı tezgahından ver.</p>'}
function draw(){
 $('bar').innerHTML='<span>'+(S.pf?PF[S.pf][0]+' ':'')+esc(S.name)+'</span><b>🪙 '+fmt(S.coins)+'</b><button class="btn" data-a="out">Çıkış</button>';
 $('tabs').hidden=!S.pf;
 if(!S.pf){$('v').innerHTML='<div class="card"><h2>Mesleğini seç</h2>'+Object.keys(PF).map(k=>'<div class="row"><span>'+PF[k][0]+' <b>'+PF[k][1]+'</b><br><span class="mut">'+PF[k][3]+'</span></span><button class="btn" data-a="pf" data-k="'+k+'">Seç</button></div>').join('')+'</div>';return}
 document.querySelectorAll('#tabs .t').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===tab));
 $('v').innerHTML=tab==='work'?work():tab==='stall'?stall():tab==='pazar'?pazar():market();
 if(tab==='pazar')loadPz().catch(()=>{});
}
/* ---- eylemler ---- */
async function collect(){const qs=await getDocs(query(collection(db,'listings'),where('seller','==',uid),where('sold','==',true)));
 for(const d of qs.docs){const x=d.data(),n=Math.floor(x.price*x.qty*(1-TAX));S.coins+=n;await deleteDoc(d.ref);say(x.qty+' '+nm(x.crop)+' satıldı: +'+n+' 🪙 (vergi sonrası)')}
 if(!qs.empty){save();draw()}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||!S)return;const a=b.dataset.a,d=b.dataset,i=+d.i;
 try{
 if(a==='out'){if(dirty){dirty=false;await setDoc(doc(db,'users',uid),S)}return signOut(auth)}
 if(a==='tab'){tab=d.v;sel=null}
 else if(a==='pf'&&!S.pf){const s=START[d.k];S.pf=d.k;S.coins+=s.coins;for(const k in s.inv)add(k,s.inv[k]);if(s.an)S.an[0]={k:s.an,at:Date.now(),f:0};say(PF[d.k][1]+' oldun!')}
 else if(a==='sd')sd=d.k;
 else if(a==='pl'){const p=S.plots[i];if(!p){if(!have(sd))return say('Tohumun yok. Marketten al.',1);add(sd,-1);S.plots[i]={s:sd,at:Date.now()}}else if(sdone(p))harvest(i);else if(!p.g&&have('gubre')){add('gubre',-1);p.g=1;p.at-=(CR[p.s].t*1000-(Date.now()-p.at))/2}else say('Henüz büyüyor.')}
 else if(a==='mt'){let n=0;S.plots.forEach((p,j)=>{if(p&&sdone(p))n++;else if(!p&&have(sd))n++});if(!n)return say('Yapılacak iş yok.',1);if(!useMk('mk_tarim'))return;S.plots.forEach((p,j)=>{if(p&&sdone(p))harvest(j);if(!S.plots[j]&&have(sd)){add(sd,-1);S.plots[j]={s:sd,at:Date.now()}}});say('Makine işini yaptı.')}
 else if(a==='an'){const x=S.an[i];if(!feedCollect(x))say(have('yem')||x.f>0?'Henüz üretmedi.':'Yemin yok. Marketten ya da otomatçıdan al.',1)}
 else if(a==='ma'){if(!S.an.some(x=>x&&((x.f>0&&Date.now()-x.at>=AN[x.k].t*1000)||(x.f<=0&&have('yem')))))return say('Yapılacak iş yok.',1);if(!useMk('mk_hayvan'))return;S.an.forEach(x=>{if(x)feedCollect(x)});say('Makine işini yaptı.')}
 else if(a==='cr'){const c=CRAFT[i];if(Object.keys(c[2]).some(k=>have(k)<c[2][k]))return;for(const k in c[2])add(k,-c[2][k]);add(c[0],c[1]);say(nm(c[0])+' üretildi.')}
 else if(a==='sel')sel=d.k;
 else if(a==='bm'){const m=M[i];if(left1(m[0])||S.coins<m[2])return;if(AN[m[0]]){const s=S.an.findIndex(x=>!x);if(s<0)return say('Boş yerin yok.',1);S.an[s]={k:m[0],at:Date.now(),f:0}}else add(m[0],m[1]);S.coins-=m[2];S.mk[m[0]]=Date.now();say(nm(m[0])+' alındı.')}
 else if(a==='list'){const k=sel,q=Math.floor(+$('lq').value),p=Math.floor(+$('lp').value);if(!k||!(q>=1&&q<=have(k)&&p>=1&&p<=9999))return say('Adet ve fiyat geçersiz.',1);
  await addDoc(collection(db,'listings'),{seller:uid,name:S.name,crop:k,qty:q,price:p,sold:false,createdAt:Date.now()});add(k,-q);say('İlan verildi.')}
 else if(a==='bl'){const ref=doc(db,'listings',d.id);const x=await runTransaction(db,async tx=>{const s=await tx.get(ref);if(!s.exists()||s.data().sold)throw 0;tx.update(ref,{sold:true,buyer:uid});return s.data()});
  if(S.coins<x.price*x.qty)return say('Paran yetmedi.',1);S.coins-=x.price*x.qty;add(x.crop,x.qty);say(x.qty+' '+nm(x.crop)+' aldın.')}
 else if(a==='cx'){const ref=doc(db,'listings',d.id);const x=await runTransaction(db,async tx=>{const s=await tx.get(ref);if(!s.exists()||s.data().sold)throw 0;tx.delete(ref);return s.data()});add(x.crop,x.qty);say('İlan iptal edildi.')}
 }catch(err){say('İşlem tamamlanamadı. İlan satılmış olabilir.',1)}
 save();draw()});

const errs={'auth/invalid-credential':'Kullanıcı adı veya şifre hatalı.','auth/email-already-in-use':'Bu kullanıcı adı alınmış.','auth/weak-password':'Şifre en az 6 karakter olmalı.','auth/invalid-email':'Geçersiz kullanıcı adı.','auth/missing-password':'Şifre gir.','auth/too-many-requests':'Çok fazla deneme, biraz bekle.','auth/network-request-failed':'Bağlantı yok.'};
const aerr=e=>{$('aerr').textContent=errs[e.code]||('Hata: '+e.code)};
const fold=x=>x.trim().toLocaleLowerCase('tr').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u');
const UNOK=/^[A-Za-z0-9_çğıöşüÇĞİÖŞÜ]{3,16}$/,LSK='bahce.giris';
const mail=u=>u.includes('@')?u.trim():fold(u)+'@bahcivan.local';
const lsGet=()=>{try{return JSON.parse(localStorage.getItem(LSK)||'null')}catch(e){return null}};
const lsSet=v=>{try{localStorage.setItem(LSK,JSON.stringify(v))}catch(e){}};
let regMode=false;
