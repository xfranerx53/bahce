<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minik Bahçe Diyarı</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4f2dc;--panel:#fff;--ink:#1d2b1f;--mut:#5b6f5e;--soil:#8a5a33;--soil2:#a0703f;--leaf:#2f7d3a;--line:#c9dcc0;--bad:#b3402a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a12;--panel:#1a2a1f;--ink:#e6f1e3;--mut:#9bb09e;--soil:#6b4425;--soil2:#82552d;--leaf:#5cbf6a;--line:#2c4232;--bad:#e8806a}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:680px;padding:12px;background:var(--bg);color:var(--ink);font-family:Fredoka,ui-rounded,system-ui,sans-serif}
h1{font-size:22px;margin:4px 0 10px}h2{font-size:16px;margin:0 0 8px}
[hidden]{display:none!important}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:600}
.xp{flex:1 1 100%;height:8px;background:var(--line);border-radius:6px;overflow:hidden}.xp i{display:block;height:100%;background:var(--leaf)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--soil);padding:8px;border-radius:16px;margin:12px 0}
.p{aspect-ratio:1;background:var(--soil2);border:0;border-radius:10px;font-size:clamp(24px,8vw,40px);position:relative;cursor:pointer;color:inherit;display:flex;align-items:center;justify-content:center}
.p .b{position:absolute;left:6px;right:6px;bottom:5px;height:5px;background:rgba(0,0,0,.3);border-radius:3px;overflow:hidden}.p .b i{display:block;height:100%;background:#8fe08c}
.p .d{position:absolute;top:2px;right:4px;font-size:13px}.p.ready{box-shadow:inset 0 0 0 3px #ffd84a}.p.mole{background:#4d3a2a}
.tools,.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.t,.btn{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:8px 10px;font:inherit;font-size:14px;cursor:pointer}
.t[aria-pressed=true]{border-color:var(--leaf);background:var(--leaf);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #2a7fc1;outline-offset:2px}
input{font:inherit;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row:last-child{border:0}
.f{display:flex;gap:4px;flex-wrap:wrap}.f input{width:64px;margin:0;padding:6px}
.mut{color:var(--mut);font-size:13px}.msg{min-height:22px;font-size:14px;color:var(--leaf);font-weight:600;margin:0 0 8px}.msg.err,#aerr{color:var(--bad)}
.chat{max-height:320px;overflow:auto;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--bg)}.cm{padding:3px 0;font-size:14px;word-break:break-word}
.pb{height:6px;background:var(--line);border-radius:4px;margin-top:4px;overflow:hidden;width:180px;max-width:100%}.pb i{display:block;height:100%;background:var(--leaf)}
</style>
</head>
<body>
<h1>🌱 Minik Bahçe Diyarı</h1>

<div id="auth" class="card">
  <h2>Giriş yap ya da hesap oluştur</h2>
  <input id="em" type="email" placeholder="E-posta" autocomplete="email">
  <input id="pw" type="password" placeholder="Şifre (en az 6 karakter)" autocomplete="current-password">
  <input id="nm" placeholder="Takma ad (sadece kayıt için, 3-16 karakter)" maxlength="16">
  <div class="f"><button class="btn" id="login">Giriş yap</button><button class="btn" id="reg">Hesap oluştur</button></div>
  <p id="aerr" role="alert"></p>
</div>

<div id="app" hidden>
  <div class="card bar" id="bar"></div>
  <div class="tabs" id="tabs">
    <button class="t" data-v="garden">🌾 Bahçe</button>
    <button class="t" data-v="market">🛒 Pazar</button>
    <button class="t" data-v="top">🏆 Sıralama</button>
    <button class="t" data-v="guild">🏰 Lonca</button>
    <button class="t" data-v="chat">💬 Sohbet</button>
  </div>
  <p class="msg" id="msg" role="status"></p>
  <section id="v-garden">
    <div class="grid" id="grid"></div>
    <div class="tools" id="tools"></div>
    <div id="mo"></div>
    <div class="card"><h2>Dükkan</h2><div id="shop"></div></div>
  </section>
  <section id="v-market" hidden>
    <div class="card"><div id="mk-inv"></div></div>
    <div class="card"><h2>Oyuncu pazarı</h2><div id="mk-list"></div></div>
  </section>
  <section id="v-top" hidden><div class="card"><h2>En iyi bahçıvanlar</h2><p class="mut">Rakibine köstebek gönder: tarlasını kapatır, kaldırması altına mal olur.</p><div id="tp"></div></div></section>
  <section id="v-guild" hidden><div id="gd"></div></section>
  <section id="v-chat" hidden><div class="card"><h2>Genel sohbet</h2><div id="cl" class="chat"></div><div class="f" style="margin-top:8px"><input id="ci" maxlength="140" placeholder="Mesaj yaz…" style="flex:1;width:auto"><button class="btn" data-chat="1">Gönder</button></div></div></section>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,query,orderBy,limit,getDocs,addDoc,where,deleteDoc,runTransaction,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyB91qaXPfss8qloRDsUV8snNIaA8CXf_b4",
  authDomain: "bahcivanlar-17544.firebaseapp.com",
  projectId: "bahcivanlar-17544",
  appId: "1:376440194167:web:e439d7a5975f3a2215f272"
};


const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const C={
 havuc:{n:'Havuç',e:'🥕',g:30,s:5,p:9,l:1,x:2},
 marul:{n:'Marul',e:'🥬',g:45,s:8,p:14,l:1,x:3},
 sogan:{n:'Soğan',e:'🧅',g:60,s:10,p:18,l:2,x:4},
 cilek:{n:'Çilek',e:'🍓',g:90,s:15,p:28,l:3,x:6},
 domates:{n:'Domates',e:'🍅',g:120,s:20,p:38,l:4,x:8},
 misir:{n:'Mısır',e:'🌽',g:180,s:30,p:60,l:5,x:12},
 balkabagi:{n:'Balkabağı',e:'🎃',g:300,s:50,p:100,l:7,x:20}
};
let S,uid,pend,tool='water',moles={},nextEv=0,dirty=false;
const P={havuc:[0,7],marul:[6,18],sogan:[10,26],cilek:[16,42],domates:[24,62],misir:[36,100],balkabagi:[60,190]};
for(const k in P){C[k].s=P[k][0];C[k].p=P[k][1]}
const MOLE_SEND=50,MOLE_FIX=30;let unChat=null,lastChat=0;
const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lvl=()=>Math.floor(Math.sqrt(S.xp/10))+1;
const unl=()=>Object.keys(C).filter(k=>C[k].l<=lvl());
const npc=k=>Math.round(C[k].p*.8)*(S.inv[k]||0);
const save=()=>{dirty=true};
const say=(t,e)=>{const m=$('msg');m.textContent=t;m.className='msg'+(e?' err':'')};
const newUser=n=>({name:n||'Bahçıvan',coins:50,xp:0,inv:{},plots:Array(8).fill(null),gnome:false,moles:[],lastMole:0,lastBonus:0});

/* ---------- Giriş / kayıt ---------- */
const errs={'auth/invalid-credential':'E-posta veya şifre hatalı.','auth/email-already-in-use':'Bu e-posta zaten kayıtlı.','auth/weak-password':'Şifre en az 6 karakter olmalı.','auth/invalid-email':'Geçersiz e-posta.','auth/missing-password':'Şifre gir.'};
const aerr=e=>{$('aerr').textContent=errs[e.code]||('Hata: '+e.code)};
$('login').onclick=()=>signInWithEmailAndPassword(auth,$('em').value,$('pw').value).catch(aerr);
$('reg').onclick=()=>{
 const n=$('nm').value.trim();
 if(n.length<3||n.length>16){$('aerr').textContent='Takma ad 3-16 karakter olmalı.';return}
 pend=n;createUserWithEmailAndPassword(auth,$('em').value,$('pw').value).catch(aerr);
};
onAuthStateChanged(auth,async u=>{
 $('auth').hidden=!!u;$('app').hidden=!u;
 if(!u){uid=null;S=null;if(unChat){unChat();unChat=null}return}
 uid=u.uid;const r=doc(db,'users',uid);let s=await getDoc(r);
 if(!s.exists()){await setDoc(r,newUser(pend));s=await getDoc(r)}
 S=s.data();S.moles=S.moles||[];S.guild=S.guild||null;S.gp=S.gp||0;S.gs=S.gs||0;S.q=S.q||{d:0,c:{},done:{}};S.planter=!!S.planter;S.pcrop=S.pcrop||'havuc';S.lastGR=S.lastGR||0;S.streak=S.streak||0;rollover();S.plots=S.plots.map(p=>p&&p.w?null:p);nextEv=Infinity;
 await collect();await getMoles();draw();show('garden');startChat();
});

/* ---------- Bahçe ---------- */
function click(i){
 const p=S.plots[i];
 if(hasMole(i))say('Bu tarlada köstebek var! Aşağıdan altınla kaldır.',1);
 
 else if(p&&p.c){
  const c=C[p.c];
  if(p.at&&Date.now()-p.at>=c.g*1000){
   const b=lvl(),q=Math.random()<.1?4:2;S.inv[p.c]=(S.inv[p.c]||0)+q;S.xp+=c.x;S.plots[i]=null;cnt('h');
   say((q>2?'✨ Şanslı hasat! ':'')+q+' '+c.n+' topladın! +'+c.x+' XP');if(lvl()>b)say('Seviye '+lvl()+'! Yeni bitkiler açıldı.');
  }else if(!p.at){if(tool==='water'){p.at=Date.now();say('Sulandı, büyüyor.')}else say('Önce sulama aletini seç.',1)}
  else say('Henüz olgunlaşmadı.',1);
 }else if(!p){
  if(tool==='water')say('Boş tarla. Bir tohum seç.',1);
  else{const c=C[tool];if(S.coins>=c.s){S.coins-=c.s;S.plots[i]={c:tool,at:null};cnt('pl');say(c.n+' ekildi. Şimdi sula.')}else say('Yetersiz altın.',1)}
 }
 save();draw();
}
function drawGrid(){
 const now=Date.now();
 $('grid').innerHTML=S.plots.map((p,i)=>{
  let h='',cls='p',lab='Boş tarla';
  if(hasMole(i)){cls+=' mole';h='🕳️'+(p&&p.c?'<span class="d">'+C[p.c].e+'</span>':'');lab='Köstebek'}
  
  else if(p){
   const c=C[p.c],pr=p.at?Math.min(1,(now-p.at)/(c.g*1000)):0;
   if(pr>=1){h=c.e;cls+=' ready';lab=c.n+' hazır'}
   else{lab=c.n+' büyüyor';h=(!p.at?'🌰':pr<.5?'🌱':'🪴')+'<span class="b"><i style="width:'+pr*100+'%"></i></span>'+(!p.at?'<span class="d">💧</span>':'')}
  }
  return '<button class="'+cls+'" data-i="'+i+'" aria-label="'+lab+'">'+h+'</button>';
 }).join('');
}
function drawBar(){
 const l=lvl(),lo=(l-1)**2*10,hi=l*l*10;
 $('bar').innerHTML='<span>👤 '+esc(S.name)+'</span><span>🪙 '+S.coins+'</span><span>⭐ Seviye '+l+'</span><span class="mut">'+S.xp+' / '+hi+' XP</span><button class="btn" data-out="1">Çıkış</button><div class="xp"><i style="width:'+Math.min(100,(S.xp-lo)/(hi-lo)*100)+'%"></i></div>';
}
function drawPanels(){
 $('tools').innerHTML='<button class="t" data-tool="water" aria-pressed="'+(tool==='water')+'">💧 Sula</button>'+unl().map(k=>'<button class="t" data-tool="'+k+'" aria-pressed="'+(tool===k)+'">'+C[k].e+' '+C[k].n+' ('+(C[k].s||'bedava')+')</button>').join('');
 const pc=S.plots.length*50-200;
 const bd=Date.now()-(S.lastBonus||0)<864e5;
 $('shop').innerHTML='<div class="row"><span>🎁 Günlük hediye</span><button class="btn" data-bonus="1"'+(bd?' disabled':'')+'>'+(bd?'Yarın tekrar gel':(40+lvl()*10)+' 🪙 al')+'</button></div><div class="row"><span>🟫 Yeni tarlalar (+4) <span class="mut">'+S.plots.length+'/20</span></span><button class="btn" data-buy="plot"'+(S.plots.length>=20||S.coins<pc?' disabled':'')+'>'+(S.plots.length>=20?'En fazla':pc+' 🪙')+'</button></div>'+
  '<div class="row"><span>🧙 Sulama cücesi <span class="mut">(Seviye 8)</span></span><button class="btn" data-buy="gnome"'+(S.gnome||lvl()<8||S.coins<WG?' disabled':'')+'>'+(S.gnome?'Satın alındı':WG+' 🪙')+'</button></div>'+planterRows();
}
function draw(){drawBar();drawGrid();drawPanels();drawMoles()}

/* ---------- Pazar ---------- */
async function collect(){
 const qs=await getDocs(query(collection(db,'listings'),where('seller','==',uid),where('sold','==',true)));
 for(const d of qs.docs){const x=d.data();S.coins+=x.price*x.qty;cnt('sl',x.qty);await deleteDoc(d.ref);say(x.qty+' '+(C[x.crop]?.n||'ürün')+' satıldı! +'+x.price*x.qty+' 🪙')}
 if(!qs.empty){save();draw()}
}
async function drawMarket(){
 const inv=Object.keys(S.inv).filter(k=>S.inv[k]>0&&C[k]);
 $('mk-inv').innerHTML='<h2>Deponun</h2>'+(inv.map(k=>'<div class="row"><span>'+C[k].e+' '+C[k].n+' × '+S.inv[k]+'</span><span class="f"><input id="q-'+k+'" type="number" min="1" max="'+S.inv[k]+'" value="'+S.inv[k]+'" aria-label="Adet"><input id="p-'+k+'" type="number" min="1" value="'+C[k].p+'" aria-label="Birim fiyat"><button class="btn" data-list="'+k+'">Pazara koy</button><button class="btn" data-npc="'+k+'">Tüccara '+npc(k)+' 🪙</button></span></div>').join('')||'<p class="mut">Deponda ürün yok. Hasat edince burada görünür.</p>');
 $('mk-list').innerHTML='<p class="mut">Yükleniyor…</p>';
 const qs=await getDocs(query(collection(db,'listings'),where('sold','==',false),limit(30)));
 const ls=qs.docs.map(d=>({id:d.id,...d.data()})).filter(d=>C[d.crop]).sort((a,b)=>b.createdAt-a.createdAt);
 $('mk-list').innerHTML=ls.map(d=>'<div class="row"><span>'+C[d.crop].e+' '+d.qty+' × '+d.price+' 🪙 <span class="mut">'+esc(d.name)+'</span></span>'+(d.seller===uid?'<button class="btn" data-cancel="'+d.id+'">İptal</button>':'<button class="btn" data-buyl="'+d.id+'"'+(S.coins<d.price*d.qty?' disabled':'')+'>Al ('+d.price*d.qty+' 🪙)</button>')+'</div>').join('')||'<p class="mut">Şu an ilan yok. İlk ilanı sen ver.</p>';
}
async function drawTop(){
 $('tp').innerHTML='<p class="mut">Yükleniyor…</p>';
 const qs=await getDocs(query(collection(db,'users'),orderBy('xp','desc'),limit(20)));
 $('tp').innerHTML=qs.docs.map((d,i)=>{const x=d.data();return '<div class="row"><span>'+(i+1)+'. '+esc(x.name)+'</span><span class="mut">Seviye '+(Math.floor(Math.sqrt(x.xp/10))+1)+' · '+x.xp+' XP</span>'+(d.id===uid?'':'<button class="btn" data-mole="'+d.id+'">🕳️ Gönder ('+MOLE_SEND+' 🪙)</button>')+'</div>'}).join('');
}
function show(v){
 ['garden','market','top','chat','guild'].forEach(k=>{$('v-'+k).hidden=k!==v});
 document.querySelectorAll('#tabs .t').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
 if(v==='market')drawMarket();if(v==='top')drawTop();if(v==='guild')drawGuild();
}

/* ---------- Köstebek, sohbet ---------- */
const hasMole=i=>S.moles.some(m=>m.plot===i);
async function getMoles(){
 const qs=await getDocs(query(collection(db,'attacks'),where('to','==',uid)));
 for(const d of qs.docs){
  const x=d.data(),free=S.plots.map((_,i)=>i).filter(i=>!hasMole(i));
  if(free.length&&S.moles.length<3){S.moles.push({plot:free[Math.floor(Math.random()*free.length)],from:String(x.fromName||'?').slice(0,16)});say('🕳️ '+x.fromName+' sana köstebek gönderdi!',1)}
  await deleteDoc(d.ref);
 }
 if(!qs.empty){save();draw()}
}
function drawMoles(){
 $('mo').innerHTML=S.moles.length?'<div class="card"><h2>🕳️ Köstebekler</h2>'+S.moles.map((m,i)=>'<div class="row"><span>'+esc(m.from)+' gönderdi <span class="mut">(tarla '+(m.plot+1)+')</span></span><button class="btn" data-fix="'+i+'"'+(S.coins<MOLE_FIX?' disabled':'')+'>Kaldır ('+MOLE_FIX+' 🪙)</button></div>').join('')+'</div>':'';
}
function startChat(){
 if(unChat)unChat();
 unChat=onSnapshot(query(collection(db,'chat'),orderBy('createdAt','desc'),limit(40)),qs=>{
  $('cl').innerHTML=qs.docs.slice().reverse().map(d=>{const x=d.data();return '<div class="cm"><b>'+esc(x.name)+':</b> '+esc(x.text)+'</div>'}).join('');
  $('cl').scrollTop=1e6;
 },()=>{});
}
$('ci').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('[data-chat]').click()});

/* ---------- Lonca ---------- */
const GCOST=1000,WG=8000,PG=40000;
const TASKS=[
 {id:'h',n:'🌾 10 hasat yap',t:10,gp:20,c:60},
 {id:'pl',n:'🌱 15 ekim yap',t:15,gp:15,c:40},
 {id:'sl',n:'🛒 12 ürün sat',t:12,gp:20,c:50},
 {id:'ch',n:'💬 3 sohbet mesajı yaz',t:3,gp:5,c:20},
 {id:'mo',n:'🕳️ 1 köstebek gönder',t:1,gp:10,c:0}
];
const SEASON=()=>Math.floor(Date.now()/6048e5),DAY=()=>Math.floor(Date.now()/864e5);
function rollover(){if(S.gs!==SEASON()){S.gs=SEASON();S.gp=0}if(S.q.d!==DAY())S.q={d:DAY(),c:{},done:{}}}
const cnt=(k,n=1)=>{rollover();S.q.c[k]=(S.q.c[k]||0)+n;save()};
let gRank=-1;
const planterRows=()=>'<div class="row"><span>🧑‍🌾 Ekim cücesi <span class="mut">(Seviye 12; boş tarlalara seçtiğin ürünü senin altınınla eker)</span></span><button class="btn" data-buy="planter"'+(S.planter||lvl()<12||S.coins<PG?' disabled':'')+'>'+(S.planter?'Satın alındı':PG+' 🪙')+'</button></div>'+(S.planter?'<div class="row"><span>Ekilecek ürün:</span><span class="f">'+unl().map(k=>'<button class="t" data-pc="'+k+'" aria-pressed="'+(S.pcrop===k)+'">'+C[k].e+'</button>').join('')+'</span></div>':'');
async function standings(){
 const qs=await getDocs(query(collection(db,'users'),where('gs','==',SEASON()),limit(300))),m={};
 qs.docs.forEach(d=>{const x=d.data();if(x.guild&&x.gp>0){const g=m[x.guild]=m[x.guild]||{pts:0,n:0};g.pts+=x.gp;g.n++}});
 return m;
}
async function drawGuild(){
 const el=$('gd');el.innerHTML='<div class="card mut">Yükleniyor…</div>';rollover();
 const [st,gq]=await Promise.all([standings(),getDocs(query(collection(db,'guilds'),limit(100)))]);
 const nm={};gq.docs.forEach(d=>nm[d.id]=d.data().name);
 if(S.guild&&!nm[S.guild]){const g=await getDoc(doc(db,'guilds',S.guild));if(g.exists())nm[S.guild]=g.data().name;else{S.guild=null;S.gp=0;save()}}
 const rk=Object.keys(st).filter(k=>nm[k]).sort((a,b)=>st[b].pts-st[a].pts);
 const top='<div class="card"><h2>🏆 Haftalık lonca sıralaması</h2>'+(rk.slice(0,10).map((k,i)=>'<div class="row"><span>'+(i+1)+'. '+esc(nm[k])+'</span><span class="mut">'+st[k].pts+' puan · '+st[k].n+' aktif üye</span></div>').join('')||'<p class="mut">Henüz puan yok.</p>')+'<p class="mut">Puanlar her hafta sıfırlanır. Günlük ödül sıralamaya göre verilir: 1. lonca 600, 2. lonca 350, 3. lonca 200, diğerleri 60 🪙.</p></div>';
 if(!S.guild){
  el.innerHTML='<div class="card"><h2>Lonca kur ('+GCOST+' 🪙)</h2><input id="gn" maxlength="16" placeholder="Lonca adı (3-16 karakter)"><button class="btn" data-gnew="1"'+(S.coins<GCOST?' disabled':'')+'>Kur</button></div><div class="card"><h2>Loncalara katıl</h2>'+(gq.docs.map(d=>'<div class="row"><span>'+esc(d.data().name)+' <span class="mut">'+(st[d.id]?st[d.id].pts+' puan':'')+'</span></span><button class="btn" data-gjoin="'+d.id+'">Katıl</button></div>').join('')||'<p class="mut">Henüz lonca yok. İlk loncayı sen kur.</p>')+'</div>'+top;
  return;
 }
 gRank=rk.indexOf(S.guild);const rw=[600,350,200][gRank]||60,can=S.gp>=10&&Date.now()-S.lastGR>=864e5;
 el.innerHTML='<div class="card"><h2>🏰 '+esc(nm[S.guild])+'</h2><p class="mut">Sıran: '+(gRank<0?'-':'#'+(gRank+1))+' · Bu haftaki puanın: '+S.gp+'</p><div class="row"><span>Günlük sıralama ödülü: '+rw+' 🪙 <span class="mut">(en az 10 puan gerekir)</span></span><button class="btn" data-grew="1"'+(can?'':' disabled')+'>Al</button></div></div><div class="card"><h2>Günlük lonca görevleri</h2>'+TASKS.map(t=>{const c=Math.min(S.q.c[t.id]||0,t.t),dn=S.q.done[t.id];return '<div class="row"><div>'+t.n+' <span class="mut">'+c+'/'+t.t+' · +'+t.gp+' puan, +'+t.c+' 🪙</span><div class="pb"><i style="width:'+c/t.t*100+'%"></i></div></div><button class="btn" data-task="'+t.id+'"'+(dn||c<t.t?' disabled':'')+'>'+(dn?'Alındı':'Al')+'</button></div>'}).join('')+'</div>'+top+'<button class="btn" data-gleave="1">Loncadan ayrıl</button>';
}

/* ---------- Olaylar ---------- */
document.addEventListener('click',async e=>{
 const t=e.target.closest('button');if(!t||!S)return;const d=t.dataset;
 try{
  if(d.i!==undefined)return click(+d.i);
  if(d.v)return show(d.v);
  if(d.out)return signOut(auth);
  if(d.tool)tool=d.tool;
  else if(d.buy==='plot'){const pc=S.plots.length*50-200;if(S.coins>=pc&&S.plots.length<20){S.coins-=pc;S.plots.push(null,null,null,null);say('Yeni tarlalar açıldı.')}}
  else if(d.bonus&&Date.now()-(S.lastBonus||0)>=864e5){const st=Date.now()-(S.lastBonus||0)<1728e5?Math.min(7,S.streak+1):1,b=40+lvl()*10+st*20;S.streak=st;S.coins+=b;S.lastBonus=Date.now();say('Günlük hediye: +'+b+' 🪙 ('+st+'. gün serisi)')}
  else if(d.mole){
   if(S.coins<MOLE_SEND)return say('Yetersiz altın.',1);
   if(Date.now()-(S.lastMole||0)<30000)return say('Köstebekler dinleniyor, 30 saniye bekle.',1);
   const t=await getDoc(doc(db,'users',d.mole));
   if(!t.exists()||(t.data().moles||[]).length>=3)return say('Bu oyuncuya şu an köstebek gönderilemez.',1);
   await addDoc(collection(db,'attacks'),{from:uid,fromName:S.name,to:d.mole,createdAt:Date.now()});
   S.coins-=MOLE_SEND;S.lastMole=Date.now();cnt('mo');say('Köstebek gönderildi! -'+MOLE_SEND+' 🪙');
  }
  else if(d.fix!==undefined){if(S.coins>=MOLE_FIX){S.coins-=MOLE_FIX;S.moles.splice(+d.fix,1);say('Köstebek kaldırıldı.')}}
  else if(d.chat){
   const t=$('ci').value.trim().slice(0,140);if(!t||Date.now()-lastChat<2000)return;
   lastChat=Date.now();cnt('ch');$('ci').value='';await addDoc(collection(db,'chat'),{uid,name:S.name,text:t,createdAt:Date.now()});return;
  }
  else if(d.buy==='planter'&&S.coins>=PG&&lvl()>=12&&!S.planter){S.coins-=PG;S.planter=true;say('Ekim cücesi işe başladı.')}
  else if(d.pc){S.pcrop=d.pc;say(C[d.pc].n+' ekilecek.')}
  else if(d.gnew){
   const n=($('gn').value||'').trim();
   if(n.length<3||n.length>16)return say('Lonca adı 3-16 karakter olmalı.',1);
   if(S.coins<GCOST)return say('Yetersiz altın.',1);
   const r=await addDoc(collection(db,'guilds'),{name:n,leader:uid,createdAt:Date.now()});
   S.coins-=GCOST;S.guild=r.id;S.gp=0;say('Lonca kuruldu!');save();draw();return drawGuild();
  }
  else if(d.gjoin){
   const m=await getDocs(query(collection(db,'users'),where('guild','==',d.gjoin),limit(16)));
   if(m.size>=15)return say('Lonca dolu (en fazla 15 üye).',1);
   S.guild=d.gjoin;S.gp=0;say('Loncaya katıldın!');save();draw();return drawGuild();
  }
  else if(d.gleave){S.guild=null;S.gp=0;say('Loncadan ayrıldın.');save();draw();return drawGuild()}
  else if(d.task){
   rollover();const t=TASKS.find(x=>x.id===d.task);
   if(t&&(S.q.c[t.id]||0)>=t.t&&!S.q.done[t.id]){S.q.done[t.id]=1;S.coins+=t.c;if(S.guild)S.gp+=t.gp;say('Görev tamam! +'+t.c+' 🪙'+(S.guild?' +'+t.gp+' lonca puanı':''))}
   save();draw();return drawGuild();
  }
  else if(d.grew){
   if(S.gp>=10&&Date.now()-S.lastGR>=864e5){const rw=[600,350,200][gRank]||60;S.coins+=rw;S.lastGR=Date.now();say('Lonca ödülü: +'+rw+' 🪙')}
   save();draw();return drawGuild();
  }
  else if(d.buy==='gnome'&&S.coins>=WG&&lvl()>=8&&!S.gnome){S.coins-=WG;S.gnome=true;say('Sulama cücesi işe başladı.')}
  else if(d.npc){const k=d.npc,g=npc(k);cnt('sl',S.inv[k]||0);S.coins+=g;S.inv[k]=0;say('Tüccara satıldı. +'+g+' 🪙');save();draw();return drawMarket()}
  else if(d.list){
   const k=d.list,q=Math.floor(+$('q-'+k).value),p=Math.floor(+$('p-'+k).value);
   if(!(q>=1&&q<=S.inv[k]&&p>=1&&p<=9999))return say('Adet ve fiyat geçersiz.',1);
   await addDoc(collection(db,'listings'),{seller:uid,name:S.name,crop:k,qty:q,price:p,sold:false,createdAt:Date.now()});
   S.inv[k]-=q;say('İlan verildi.');save();draw();return drawMarket();
  }
  else if(d.buyl){
   const ref=doc(db,'listings',d.buyl);
   const x=await runTransaction(db,async tx=>{const s=await tx.get(ref);if(!s.exists()||s.data().sold)throw new Error('gone');tx.update(ref,{sold:true,buyer:uid});return s.data()});
   if(!C[x.crop]||S.coins<x.price*x.qty)return say('Satın alma başarısız.',1);
   S.coins-=x.price*x.qty;S.inv[x.crop]=(S.inv[x.crop]||0)+x.qty;say(x.qty+' '+C[x.crop].n+' satın aldın.');save();draw();return drawMarket();
  }
  else if(d.cancel){
   const ref=doc(db,'listings',d.cancel);
   const x=await runTransaction(db,async tx=>{const s=await tx.get(ref);if(!s.exists()||s.data().sold)throw new Error('gone');tx.delete(ref);return s.data()});
   S.inv[x.crop]=(S.inv[x.crop]||0)+x.qty;say('İlan iptal edildi.');save();draw();return drawMarket();
  }
  save();draw();
 }catch(err){say('İşlem tamamlanamadı. İlan satılmış ya da bağlantı kopmuş olabilir.',1);if(!$('v-market').hidden)drawMarket()}
});

/* ---------- Döngü ---------- */
setInterval(()=>{
 if(!S)return;const now=Date.now();
 for(const k in moles)if(now>moles[k]){delete moles[k];if(S.plots[k]?.c){S.plots[k]=null;say('Bir köstebek mahsulünü yedi!',1);save()}}
 if(S.planter)S.plots.forEach((p,i)=>{const c=C[S.pcrop];if(!p&&c&&!hasMole(i)&&lvl()>=c.l&&S.coins>=c.s){S.coins-=c.s;S.plots[i]={c:S.pcrop,at:null};cnt('pl');drawBar()}});
 if(S.gnome)S.plots.forEach((p,i)=>{if(p?.c&&!p.at&&!hasMole(i)){p.at=now;save()}});
 if(now>nextEv){
  nextEv=now+20000+Math.random()*15000;
  const empty=[],pl=[];S.plots.forEach((p,i)=>{if(!p)empty.push(i);else if(p.c&&!moles[i])pl.push(i)});
  if(Math.random()<.5&&empty.length)S.plots[empty[Math.floor(Math.random()*empty.length)]]={w:1};
  else if(pl.length){moles[pl[Math.floor(Math.random()*pl.length)]]=now+15000;say('Bir köstebek geldi! Hemen tıkla.',1)}
  save();
 }
 drawGrid();
},500);
setInterval(()=>{if(S&&dirty){dirty=false;setDoc(doc(db,'users',uid),S).catch(()=>{dirty=true})}},4000);
setInterval(()=>{if(S)collect().catch(()=>{})},30000);
setInterval(()=>{if(S)getMoles().catch(()=>{})},20000);
setInterval(()=>{if(S)rollover()},60000);
document.addEventListener('visibilitychange',()=>{if(S&&dirty&&document.hidden){dirty=false;setDoc(doc(db,'users',uid),S)}});

</script>
</body>
</html>
